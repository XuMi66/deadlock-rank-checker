name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.1 (leave empty to only build artifacts)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Windows builds (EN + ZH)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Decode icon (optional)
        id: icon
        shell: pwsh
        env:
          ICON_B64: ${{ secrets.ICON_BASE64 }}
        run: |
          if ($env:ICON_B64) {
            [IO.File]::WriteAllBytes("$PWD\icon.ico", [Convert]::FromBase64String($env:ICON_B64))
            "flag=--icon $PWD\icon.ico" >> $env:GITHUB_OUTPUT
            Write-Host "icon: using repository secret ICON_BASE64"
          } else {
            "flag=" >> $env:GITHUB_OUTPUT
            Write-Host "icon: not provided, building with the default Python icon"
          }

      - name: Build English exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --clean `
            --name DeadlockRankChecker `
            --distpath out-en --workpath build-en --specpath build-en `
            ${{ steps.icon.outputs.flag }} src/coach_en.py

      - name: Build Chinese exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --clean `
            --name DeadlockRankChecker-zh `
            --distpath out-zh --workpath build-zh --specpath build-zh `
            ${{ steps.icon.outputs.flag }} src/coach.py
          Rename-Item "out-zh\DeadlockRankChecker-zh.exe" "死锁排位查询.exe"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg-en, pkg-zh | Out-Null
          Copy-Item "out-en\DeadlockRankChecker.exe" pkg-en\
          Copy-Item packaging\README-en.txt pkg-en\README.txt
          Copy-Item assets\screenshot-en.png pkg-en\screenshot.png
          Compress-Archive -Path "pkg-en\*" -DestinationPath "DeadlockRankChecker-win64.zip" -Force

          Copy-Item "out-zh\死锁排位查询.exe" pkg-zh\
          Copy-Item packaging\README-zh.txt "pkg-zh\使用说明.txt"
          Copy-Item assets\screenshot-zh.png "pkg-zh\界面预览.png"
          Compress-Archive -Path "pkg-zh\*" -DestinationPath "DeadlockRankChecker-win64-zh.zip" -Force

          Get-ChildItem *.zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win64-builds
          path: |
            DeadlockRankChecker-win64.zip
            DeadlockRankChecker-win64-zh.zip

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          generate_release_notes: true
          files: |
            DeadlockRankChecker-win64.zip
            DeadlockRankChecker-win64-zh.zip
